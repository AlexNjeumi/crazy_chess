services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres-radicle
    restart: always
    hostname: postgres
    environment:
      POSTGRES_USER: chess-user
      POSTGRES_PASSWORD: Alexandre
      POSTGRES_DB: chess-api
    ports:
      - "5432:5432"

  chess-api:
    build: .
    container_name: chess-api
    restart: on-failure
    command: [ "--reload" ]
    volumes:
      - ./app:/home/app/app
      - ./db:/home/app/db
      - ./scripts:/home/app/scripts
      - ./alembic:/home/app/alembic
    ports:
      - "8080:8080"
    environment:
      FASTAPI_WORKERS: 2
    env_file:
      - ./.env
    depends_on:
      - postgres